app-id: com.beavernotes.beavernotes
runtime: org.gnome.Platform
runtime-version: "51"
sdk: org.gnome.Sdk
command: beaver-notes
finish-args:
  - --device=dri
  - --env=XCURSOR_PATH=/run/host/user-share/icons:/run/host/share/icons
  - --filesystem=xdg-run/gvfs
  - --filesystem=xdg-run/gvfsd
  - --share=ipc
  - --socket=pulseaudio
  - --socket=wayland
  - --socket=fallback-x11
  - --talk-name=org.gtk.vfs.*
  - --env=WEBKIT_DISABLE_COMPOSITING_MODE=1

modules:
  - name: beaver-notes
    buildsystem: simple
    build-commands:
      - install -Dm0755 bin/beaver-notes $FLATPAK_DEST/bin/beaver-notes
      - install -Dm0755 lib/beaver-notes/beaver-notes $FLATPAK_DEST/lib/beaver-notes/beaver-notes
      - install -Dm0644 com.beavernotes.beavernotes.desktop $FLATPAK_DEST/share/applications/com.beavernotes.beavernotes.desktop
      - install -Dm0644 com.beavernotes.beavernotes.metainfo.xml -t $FLATPAK_DEST/share/metainfo/
      - install -Dm0644 icons/512x512.png $FLATPAK_DEST/share/icons/hicolor/512x512/apps/com.beavernotes.beavernotes.png

    sources:
      - type: archive
        only-arches:
          - x86_64
        url: https://github.com/Beaver-Notes/Beaver-Notes/releases/download/v5.0.0/Beaver-Notes-5.0.0-x86_64.tar.gz
        sha256: 4ad18e487d3a87a93a04ee9627bb8aac21733a12d96ca7230f888032a077501b

      - type: archive
        only-arches:
          - aarch64
        url: https://github.com/Beaver-Notes/Beaver-Notes/releases/download/v5.0.0/Beaver-Notes-5.0.0-aarch64.tar.gz
        sha256: 0d728a083c44dabb86ed9c53f783a63ee25f90abdf0461457987a129f15605ac

      - type: inline
        dest-filename: com.beavernotes.beavernotes.desktop
        contents: |
          [Desktop Entry]
          Name=Beaver Notes
          Comment=Private note taking app
          Exec=beaver-notes %U
          Icon=com.beavernotes.beavernotes
          Type=Application
          Categories=Office;Utility;
          MimeType=application/x-beaver-notes;text/markdown;text/plain;text/html;
          Keywords=note;notes;private;encrypted;
          StartupNotify=true
          StartupWMClass=com.beavernotes.beaver-notes

      - type: file
        url: https://raw.githubusercontent.com/Beaver-Notes/Beaver-Notes/4de4e94a65e97478f72fe8abe7158683ca537b2a/flatpak/com.beavernotes.beavernotes.metainfo.xml
        sha256: 34dbf65662f8289db4e59c7ef8d86b133e31c66f2abc698f20c873c7d38ee578

      - type: file
        url: https://raw.githubusercontent.com/Beaver-Notes/Beaver-Notes/v5.0.0/buildResources/icon.png
        sha256: 0eb3eaa1091a3e12876d55832b553e6880629d9f6c54c881fdcf98dcb690ce2a
        dest: icons
        dest-filename: 512x512.png
