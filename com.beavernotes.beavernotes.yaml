app-id: com.beavernotes.beavernotes
runtime: org.gnome.Platform
runtime-version: "49"
sdk: org.gnome.Sdk
command: beaver-notes
finish-args:
  - --device=dri
  - --env=XCURSOR_PATH=/run/host/user-share/icons:/run/host/share/icons
  - --filesystem=host
  - --filesystem=xdg-run/gvfs
  - --filesystem=xdg-run/gvfsd
  - --share=ipc
  - --socket=pulseaudio
  - --socket=wayland
  - --socket=fallback-x11
  - --talk-name=org.gtk.vfs.*
  - --own-name=org.gtk.vfs.*
  - --env=WEBKIT_DISABLE_COMPOSITING_MODE=1
modules:
  - name: beaver-notes
    buildsystem: simple
    build-commands:
      - install -Dm0755 beaver-notes $FLATPAK_DEST/bin/beaver-notes
      - install -Dm0644 com.beavernotes.beavernotes.desktop $FLATPAK_DEST/share/applications/com.beavernotes.beavernotes.desktop
      - install -Dm0644 com.beavernotes.beavernotes.metainfo.xml -t $FLATPAK_DEST/share/metainfo/
      - install -Dm0644 icons/128x128.png $FLATPAK_DEST/share/icons/hicolor/128x128/apps/com.beavernotes.beavernotes.png
      - install -Dm0644 icons/128x128@2x.png $FLATPAK_DEST/share/icons/hicolor/256x256/apps/com.beavernotes.beavernotes.png
      - install -Dm0644 icons/32x32.png $FLATPAK_DEST/share/icons/hicolor/32x32/apps/com.beavernotes.beavernotes.png
    sources:
      - type: archive
        only-arches:
          - x86_64
        url: file:///home/danielerolli/Downloads/Beaver.Notes.Beta-5.0.0-beta.1-linux-x64.tar.gz
        sha256: f31114b6688474c0a896f76e2c9138ef3de9bd2c2dc10c8dcffa47251c2ec017
      - type: archive
        only-arches:
          - aarch64
        url: file:///home/danielerolli/Downloads/Beaver.Notes.Beta-5.0.0-beta.1-linux-arm64.tar.gz
        sha256: 190d201b87dcf3604f7734759e0f0a3fba3343c1ffc5e89592de48d0c827bb4e
      - type: inline
        dest-filename: com.beavernotes.beavernotes.desktop
        contents: |
          [Desktop Entry]
          Name=Beaver Notes
          Comment=Private note taking app
          Exec=beaver-notes %U
          Icon=com.beavernotes.beavernotes
          Type=Application
          Categories=Office;Utility;
          MimeType=application/x-beaver-notes;text/markdown;text/plain;text/html;
          Keywords=note;notes;private;encrypted;
          StartupNotify=true
      - type: file
        url: https://raw.githubusercontent.com/Beaver-Notes/Beaver-Notes/main/flatpak/com.beavernotes.beavernotes.metainfo.xml
        sha256: 0877cf61dcbc93860a3806a9bb815299af2727af7224585809788d1b76a4237d
      - type: file
        url: https://raw.githubusercontent.com/Beaver-Notes/Beaver-Notes/main/src-tauri/icons/128x128.png
        sha256: eeebf55d8ffe07348786b9057af253e3ca08c56b6a8f8893826381430e3c0b7b
        dest: icons
        dest-filename: 128x128.png
      - type: file
        url: https://raw.githubusercontent.com/Beaver-Notes/Beaver-Notes/main/src-tauri/icons/128x128%402x.png
        sha256: 2998b41d0c9278b08e8b3874e094920034fe983a46053c9d62764225f58ab7b0
        dest: icons
        dest-filename: 128x128@2x.png
      - type: file
        url: https://raw.githubusercontent.com/Beaver-Notes/Beaver-Notes/main/src-tauri/icons/32x32.png
        sha256: aaa96d0c53b756b77c7f46aeb72290f42256c786c69be68f6bcdeb9c7492a48e
        dest: icons
        dest-filename: 32x32.png
