app-id: com.beavernotes.beavernotes
runtime: org.gnome.Platform
runtime-version: "50"
sdk: org.gnome.Sdk
command: beaver-notes
finish-args:
  - --device=dri
  - --env=XCURSOR_PATH=/run/host/user-share/icons:/run/host/share/icons
  - --filesystem=xdg-run/gvfs
  - --filesystem=xdg-run/gvfsd
  - --share=ipc
  - --socket=pulseaudio
  - --socket=wayland
  - --socket=fallback-x11
  - --talk-name=org.gtk.vfs.*
  - --env=WEBKIT_DISABLE_COMPOSITING_MODE=1

modules:
  - name: beaver-notes
    buildsystem: simple
    build-commands:
      - install -Dm0755 beaver-notes $FLATPAK_DEST/bin/beaver-notes
      - install -Dm0644 com.beavernotes.beavernotes.desktop $FLATPAK_DEST/share/applications/com.beavernotes.beavernotes.desktop
      - install -Dm0644 com.beavernotes.beavernotes.metainfo.xml -t $FLATPAK_DEST/share/metainfo/
      - install -Dm0644 icons/512x512.png $FLATPAK_DEST/share/icons/hicolor/512x512/apps/com.beavernotes.beavernotes.png

    sources:
      - type: archive
        only-arches:
          - x86_64
        url: https://github.com/Beaver-Notes/Beaver-Notes/releases/download/v5.0.0-beta.2/Beaver-Notes-Beta-5.0.0-beta.2-linux-x64.tar.gz
        sha256: 6831cf9141f0c7aee4bd6475d67b742aecf44c3af3da304ac73f756f198be8bd

      - type: archive
        only-arches:
          - aarch64
        url: https://github.com/Beaver-Notes/Beaver-Notes/releases/download/v5.0.0-beta.2/Beaver-Notes-Beta-5.0.0-beta.2-linux-arm64.tar.gz
        sha256: d5ed6012b8087cda5f197e479cb14f52b04385c0bc16620486ed4f33fcc7a396

      - type: inline
        dest-filename: com.beavernotes.beavernotes.desktop
        contents: |
          [Desktop Entry]
          Name=Beaver Notes
          Comment=Private note taking app
          Exec=beaver-notes %U
          Icon=com.beavernotes.beavernotes
          Type=Application
          Categories=Office;Utility;
          MimeType=application/x-beaver-notes;text/markdown;text/plain;text/html;
          Keywords=note;notes;private;encrypted;
          StartupNotify=true

      - type: file
        url: https://raw.githubusercontent.com/Beaver-Notes/Beaver-Notes/a1ca57cacd9725690216120bf1b907fd8de1411b/flatpak/com.beavernotes.beavernotes.metainfo.xml
        sha256: 0877cf61dcbc93860a3806a9bb815299af2727af7224585809788d1b76a4237d

      - type: file
        url: https://raw.githubusercontent.com/Beaver-Notes/Beaver-Notes/9e78395c497aac29cf794686d99d76c6f901cb62/buildResources/icon.png
        sha256: 565d9f97f86240f6721004b6149d048ed26ecb5efd6e0cf2460f1d230f744602
        dest: icons
        dest-filename: 512x512.png
